<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>Desafio das Sementes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f7f4ee;--card:#ffffff;--line:#ece7dc;--tx:#2c3430;--mu:#7f8a84;--soft:#f3efe7;
  --ac:#5b8c62;--ac-t:#eef5eb;--gold:#d4a23a;--gold-t:#fcf4df;
  --ok:#8dbf88;--mid:#e9c36c;--bad:#e49a91;
  --sage:#d4e7cf;--sage-t:#eff6ec;--sage-d:#4f7d55;
  --sky:#d3e4f2;--sky-t:#eef5fb;--sky-d:#3f6e93;
  --lav:#e0d8f2;--lav-t:#f5f1fb;--lav-d:#6a5aa2;
  --peach:#f9dfcb;--peach-t:#fef3ea;--peach-d:#ac6537;
  --blush:#f4d4d1;--blush-t:#fcf0ef;--blush-d:#b0544d;
  --butter:#f6e8b8;--butter-t:#fdf8e5;--butter-d:#94700f;
  --sh:0 1px 2px rgba(44,52,48,.04),0 14px 34px -16px rgba(60,80,62,.22);
  --sh2:0 1px 2px rgba(44,52,48,.05),0 22px 44px -18px rgba(60,80,62,.32);
  --r:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151917;--card:#1d2320;--line:#2b332f;--tx:#ecefed;--mu:#97a39d;--soft:#232a26;
  --ac:#9fd09f;--ac-t:#24302a;--gold:#e8bf62;--gold-t:#352d1a;
  --sage:#33463a;--sage-t:#212b25;--sage-d:#b2dcae;
  --sky:#2f4352;--sky-t:#1f2830;--sky-d:#a9cdea;
  --lav:#3f3953;--lav-t:#252331;--lav-d:#c8bcf0;
  --peach:#4b3a2e;--peach-t:#2c2520;--peach-d:#f2c3a0;
  --blush:#4b3533;--blush-t:#2c2221;--blush-d:#f0b2ab;
  --butter:#4a4227;--butter-t:#2b2819;--butter-d:#efd486;
  --sh:none;--sh2:none}}
:root[data-theme="dark"]{--bg:#151917;--card:#1d2320;--line:#2b332f;--tx:#ecefed;--mu:#97a39d;--soft:#232a26;--ac:#9fd09f;--ac-t:#24302a;--gold:#e8bf62;--gold-t:#352d1a;--sage:#33463a;--sage-t:#212b25;--sage-d:#b2dcae;--sky:#2f4352;--sky-t:#1f2830;--sky-d:#a9cdea;--lav:#3f3953;--lav-t:#252331;--lav-d:#c8bcf0;--peach:#4b3a2e;--peach-t:#2c2520;--peach-d:#f2c3a0;--blush:#4b3533;--blush-t:#2c2221;--blush-d:#f0b2ab;--butter:#4a4227;--butter-t:#2b2819;--butter-d:#efd486;--sh:none;--sh2:none}
.sage{--c:var(--sage);--ct:var(--sage-t);--cd:var(--sage-d)}
.sky{--c:var(--sky);--ct:var(--sky-t);--cd:var(--sky-d)}
.lav{--c:var(--lav);--ct:var(--lav-t);--cd:var(--lav-d)}
.peach{--c:var(--peach);--ct:var(--peach-t);--cd:var(--peach-d)}
.blush{--c:var(--blush);--ct:var(--blush-t);--cd:var(--blush-d)}
.butter{--c:var(--butter);--ct:var(--butter-t);--cd:var(--butter-d)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
.serif{font-family:Fraunces,Georgia,serif}

/* topo */
.hero{position:relative;padding:calc(22px + env(safe-area-inset-top)) 18px 54px;overflow:hidden;
  background:
    radial-gradient(520px 260px at 8% 10%,var(--sage) 0,transparent 70%),
    radial-gradient(420px 240px at 95% 0%,var(--lav) 0,transparent 70%),
    radial-gradient(460px 260px at 70% 120%,var(--peach) 0,transparent 70%),
    var(--bg)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:580px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
body.lider .hero-in,body.lider .wrap{max-width:820px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:48px;height:48px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:24px;box-shadow:var(--sh)}
.hero h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:25px;line-height:1.1;margin:0;letter-spacing:-.01em}
.hero .sub{color:var(--mu);font-size:13px;margin-top:3px}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.pill:active{transform:scale(.96)}
.live{cursor:default;font-size:12.5px;color:var(--mu)}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px;box-shadow:0 0 0 0 var(--ok);animation:ping 2s infinite}
.live.off i{background:var(--bad);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(141,191,136,.6)}80%,100%{box-shadow:0 0 0 7px rgba(141,191,136,0)}}

.wrap{max-width:580px;margin:-30px auto 0;padding:0 14px calc(90px + env(safe-area-inset-bottom));position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
@media (hover:hover){.hv:hover{transform:translateY(-2px);box-shadow:var(--sh2)}}
.enter .card,.enter .kp>div,.enter .tabs{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter > *:nth-child(2){animation-delay:.05s}.enter > *:nth-child(3){animation-delay:.1s}.enter > *:nth-child(4){animation-delay:.15s}.enter > *:nth-child(5){animation-delay:.2s}.enter > *:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px;margin:4px 0 2px;letter-spacing:-.01em}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--ac));transition:width .8s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 2.8s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.warn{background:var(--butter-t);border:1px solid var(--butter);color:var(--butter-d);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--c);color:var(--cd)}

/* escolha de nome */
.intro{text-align:center;padding:26px 18px}
.intro .sprout{font-size:44px;display:inline-block;animation:sway 4s ease-in-out infinite;transform-origin:50% 90%}
.seg2{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:16px 0 12px}
.seg2 button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mu);transition:all .2s}
.seg2 button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.names button{min-width:0}
.names button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:14.5px;font-weight:600;cursor:pointer;text-align:left;transition:all .15s}
.names button span.n{min-width:0;line-height:1.25;overflow-wrap:anywhere}
@media (hover:hover){.names button:hover{border-color:var(--c);background:var(--ct)}}
.names button:active{transform:scale(.97)}
.leader{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--r);border:1px solid var(--lav);background:linear-gradient(120deg,var(--lav-t),var(--sky-t));font-size:15px;font-weight:700;cursor:pointer;text-align:left;box-shadow:var(--sh);transition:transform .2s}
.leader:active{transform:scale(.98)}
.leader .ic{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:20px;flex:none}
.leader .arr{margin-left:auto;color:var(--lav-d);font-size:20px}

/* código do líder */
.pin{text-align:center;padding:28px 18px}
.pwbox{max-width:320px;margin:18px auto 0;text-align:left}
.pwbox .lbl{display:block;margin-bottom:6px}
.pwtag{display:inline-block;margin-top:16px;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:800;background:var(--c);color:var(--cd)}
.pwload{margin:26px 0 6px;color:var(--mu);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px}
.pwload span{font-size:34px;animation:sway 1.2s infinite}
.pwmeter{height:5px;border-radius:99px;background:var(--soft);margin-top:8px;overflow:hidden}
.pwmeter i{display:block;height:100%;width:0;border-radius:99px;transition:all .3s}
.pwmeter i.r{background:var(--bad)}.pwmeter i.y{background:var(--mid)}.pwmeter i.g{background:var(--ok)}
.btn:disabled{opacity:.6;cursor:wait}
.dd{margin-top:4px;text-align:left}
.ddbtn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font-size:15.5px;font-weight:700;cursor:pointer;transition:all .2s}
@media (hover:hover){.ddbtn:hover{border-color:var(--sage)}}
.dd.open .ddbtn{border-color:var(--sage-d);border-bottom-left-radius:6px;border-bottom-right-radius:6px}
.ddic{width:34px;height:34px;border-radius:50%;background:var(--sage-t);display:grid;place-items:center;font-size:16px}
.ddtx{flex:1;text-align:left}
.chev{font-size:20px;color:var(--mu);transition:transform .25s;line-height:1}
.dd.open .chev{transform:rotate(180deg)}
.ddpanel{margin-top:6px;border:1.5px solid var(--sage-d);border-radius:6px 6px 18px 18px;background:var(--card);overflow:hidden;animation:ddin .25s cubic-bezier(.2,.8,.2,1)}
@keyframes ddin{from{opacity:0;transform:translateY(-6px)}}
.ddsearch{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--soft);padding:12px 16px;font-size:16px;outline:none}
.ddlist{max-height:300px;overflow-y:auto;padding:6px}
.dditem{width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border:0;border-radius:14px;background:none;font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:background .15s}
.dditem span:nth-child(2){flex:1}
.dditem .go{color:var(--mu);font-size:18px;opacity:0;transition:opacity .15s}
@media (hover:hover){.dditem:hover{background:var(--ct)}.dditem:hover .go{opacity:1}}
.dditem:active{background:var(--ct)}
.tag.ok{background:var(--sage-t);color:var(--sage-d);border-color:var(--sage)}
.rst{margin-top:12px;border:1px solid var(--blush);background:var(--blush-t);color:var(--blush-d);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.tddfake{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;color:var(--mu)}
.pwrow{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:16px;background:var(--soft);transition:border-color .2s}
.pwrow:focus-within{border-color:var(--sage-d);background:var(--card)}
.pwrow.bad{border-color:var(--bad);animation:shake .4s}
.pwrow input{flex:1;min-width:0;border:0;background:none;padding:14px 16px;font-size:16px;outline:none}
.pwrow button{border:0;background:none;padding:0 14px;font-size:18px;cursor:pointer}
.pwmsg{min-height:20px;margin-top:6px;font-size:13px;color:var(--blush-d);text-align:left}
.pin .ic{width:64px;height:64px;border-radius:20px;margin:0 auto;background:var(--lav-t);display:grid;place-items:center;font-size:28px}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--soft);border:1.5px solid var(--line);transition:all .2s}
.dots i.on{background:var(--lav-d);border-color:var(--lav-d);transform:scale(1.15)}
.dots.bad{animation:shake .4s}.dots.bad i{background:var(--bad);border-color:var(--bad)}
.dots.good i{background:var(--ok);border-color:var(--ok)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:0 auto}
.pad button{height:62px;border-radius:20px;border:0;background:var(--soft);font-size:23px;font-weight:600;cursor:pointer;transition:all .12s}
@media (hover:hover){.pad button:hover{background:var(--lav-t)}}
.pad button:active{transform:scale(.93);background:var(--lav)}
.pad button.ghost{background:none;font-size:14px;color:var(--mu);font-weight:700}

/* painel da participante */
.plant{display:flex;align-items:center;gap:18px}
.pot{flex:none;width:104px;height:104px;border-radius:32px;background:linear-gradient(160deg,var(--sage-t),var(--butter-t));border:1px solid var(--line);display:grid;place-items:center;font-size:58px;position:relative}
.pot span{display:inline-block;animation:sway 4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{50%{transform:rotate(-6deg)}}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--c);color:var(--cd)}
.mbar{position:relative;margin:18px 0 26px}
.ms{position:absolute;top:15px;transform:translateX(-50%);font-size:14px;opacity:.3;filter:grayscale(1);transition:all .3s}
.ms.on{opacity:1;filter:none}
.jr{display:flex;justify-content:space-between;position:relative}
.jr::before{content:"";position:absolute;left:22px;right:22px;top:21px;height:3px;background:var(--soft);border-radius:4px}
.jr button{position:relative;z-index:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mu);font-size:11.5px;font-weight:700;cursor:pointer}
.jr .dot{width:44px;height:44px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--tx);transition:all .25s}
.jr .part .dot{background:var(--sage-t);border-color:var(--sage);color:var(--sage-d)}
.jr .full .dot{background:var(--gold-t);border-color:var(--gold);color:var(--gold)}
.jr .on{color:var(--tx)}
.jr .on .dot{transform:translateY(-3px);box-shadow:0 8px 18px -6px rgba(91,140,98,.5);border-color:var(--ac)}
.jr .lock{opacity:.4}
@media (hover:hover){.jr button:not(.on):hover .dot{transform:translateY(-2px)}}
.wk{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:116px;height:116px;flex:none}
.ring .arc{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.rc .e{font-size:28px}.rc b{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600}
.card.full{background:linear-gradient(160deg,var(--gold-t),var(--card) 60%);border-color:var(--gold)}
.seeds{display:flex;justify-content:space-between;font-size:18px;margin:16px 2px 4px}
.seeds span{opacity:.15;filter:grayscale(1);transition:all .35s}
.seeds span.on{opacity:1;filter:none}
.seeds span.n{animation:grow .6s}
.tip{background:var(--soft);border-radius:14px;padding:10px 12px;margin:12px 0 4px;font-size:13px;color:var(--mu)}
.act{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:18px;background:var(--card);font-size:15px;font-weight:600;text-align:left;cursor:pointer;position:relative;transition:all .2s}
@media (hover:hover){.act:hover{border-color:var(--c);background:var(--ct)}}
.act:active{transform:scale(.98)}
.act .bub{flex:none;width:42px;height:42px;border-radius:14px;background:var(--ct);border:1px solid var(--c);display:grid;place-items:center;font-size:19px;transition:all .25s}
.act .tx{flex:1}
.act .pt{font-size:12.5px;font-weight:800;color:var(--mu);white-space:nowrap;padding:4px 9px;border-radius:99px;background:var(--soft)}
.act.done{background:var(--ct);border-color:var(--c)}
.act.done .bub{background:var(--cd);border-color:var(--cd);color:var(--card);font-weight:800}
.act.done .pt{background:var(--c);color:var(--cd)}
.act.pop .bub{animation:grow .5s}
@keyframes grow{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fl{position:absolute;right:64px;font-style:normal;font-weight:800;color:var(--cd);animation:fl 1s forwards;pointer-events:none}
@keyframes fl{to{opacity:0;transform:translateY(-34px)}}
.box{border-radius:18px;padding:14px;margin-top:14px;background:var(--ct);border:1px solid var(--c)}
.box b.t{color:var(--cd)}
.segs{display:flex;gap:6px;margin-top:10px}
.segs button{min-width:56px;padding:9px 12px;border-radius:12px;border:1px solid var(--c);background:var(--card);font-size:15px;font-weight:800;cursor:pointer;transition:all .15s}
.segs button.on{background:var(--cd);color:var(--card);border-color:var(--cd)}
.prize{display:flex;gap:14px;align-items:center}
.prize .g{flex:none;width:46px;height:46px;border-radius:15px;background:var(--card);display:grid;place-items:center;font-size:22px}
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:14px 0 10px;padding:14px 10px 18px;border-radius:20px;background:linear-gradient(180deg,var(--sky-t) 0%,var(--sage-t) 70%,var(--peach-t) 100%)}
.field span{font-size:24px;text-align:center;line-height:40px;border-radius:14px;transition:transform .2s}
@media (hover:hover){.field span:hover{transform:translateY(-3px) scale(1.1)}}
.field span.mine{background:var(--card);box-shadow:0 0 0 2px var(--ac)}
.grand{background:linear-gradient(130deg,var(--lav-t),var(--blush-t) 55%,var(--butter-t));border-color:var(--lav)}
.lock-msg{text-align:center;padding:30px 18px}

/* painel do líder */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:5px;margin-bottom:12px;box-shadow:var(--sh)}
.tabs button{flex:1;white-space:nowrap;padding:11px 4px;border:0;border-radius:14px;background:none;font-size:14px;font-weight:700;cursor:pointer;color:var(--mu);transition:all .2s}
.tabs button.on{background:var(--sage-t);color:var(--sage-d)}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;color:var(--mu);transition:all .15s}
.chips button.on{background:var(--tx);color:var(--card);border-color:var(--tx)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:640px){.kp{grid-template-columns:1fr 1fr}}
.kp>div{background:var(--ct);border:1px solid var(--c);border-radius:20px;padding:14px;font-size:12.5px;font-weight:600;color:var(--cd);transition:transform .2s}
@media (hover:hover){.kp>div:hover{transform:translateY(-2px)}}
.kp b{display:block;font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:600;line-height:1.15;color:var(--tx);margin-top:2px}
.kp .bar{margin-top:8px;height:6px;background:var(--card)}
.kp .bar i{background:var(--cd)}

/* ======================================================== */

// Semanas só de controle (o aluno informa o horário; NÃO valem para a competição)
const CTRL=[1,2];
const W=[1,2,3,4,5,6,7],PT=2.5,COMP=W.filter(w=>!CTRL.includes(w)),MAXT=COMP.length*10;
const isCtrl=w=>CTRL.includes(w);
// Cronograma dos encontros ao vivo: [turma de sábado, turma de segunda]

};
// Vencedores das semanas de controle, definidos pela liderança
const VENC_MANUAL={1:"seg_diogo",2:"sab_vanessa"};
const compLbl="Semanas "+COMP[0]+" a "+COMP[COMP.length-1];
const ST=PESSOAS.map(([t,s,n],i)=>({id:t+"_"+s,n,t:t==="seg"?"Segunda":"Sábado",c:CORES[i%6]}));
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const f1=n=>(Math.round(n*10)/10).toLocaleString("pt-BR");
const ini=n=>n.replace(/\./g,"").split(" ").filter(Boolean).map(x=>x[0]).slice(0,2).join("").toUpperCase();
const av=s=>`<span class="av ${s.c}">${ini(s.n)}</span>`;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

let sb=null,data={},upd={},lastSave={},ready=false,ok=false,lastUpd=null,lastKey="",cnt={},ev=[],busy=Promise.resolve();
let sess=null;try{sess=JSON.parse(ls.get("sementes_sessao")||"null")}catch(e){}
let mode="pick",me=sess&&sess.id||null,pinTxt="",pickT="Segunda",sel=null,pwState="carregando",ddOpen=false,ddQ="",cad=new Set();
if(ls.get("sementes_lider")==="1")mode="lider";else if(me)mode="aluna";
let wk=null,pop=-1,party=false;
let hSt="todos",infOpen=null,edOpen=null,gView="O",refWk=null,fT="Todas",rWk="geral",q="",sO="n",open=null,rOpen=null,hW="todas",hQ="",hModo="validos",hMais=false;

const get=id=>data[id]||{};
const mk=(id,w)=>String(get(id)["s"+w]||"0000").padEnd(4,"0").slice(0,4);
const nAt=(id,w)=>[...mk(id,w)].filter(c=>c==="1").length;
const diasS=(id,w,it)=>String(get(id)["d"+w+"_"+it]||"0000000").padEnd(7,"0").slice(0,7);
const diasN=(id,w,it)=>[...diasS(id,w,it)].filter(c=>c==="1").length;
const diasLeg=(id,w,it)=>+(get(id)["dleg"+w+"_"+it]||0)===1;
const comp=(id,w)=>nAt(id,w)===3&&+(get(id)["c"+w]||0)===1;
const pts=(id,w)=>Math.min(10,nAt(id,w)*PT+(comp(id,w)?PT:0));
const tot=id=>COMP.reduce((s,w)=>s+pts(id,w),0);  // só semanas da competição
const fmt=n=>Number.isInteger(n)?String(n):n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const stage=t=>STAGES.filter(x=>x[0]<=t).pop();
const started=id=>W.some(w=>pts(id,w)>0);
const avg=(l,w)=>l.length?l.reduce((a,s)=>a+pts(s.id,w),0)/l.length:0;
const cls=p=>p>=7.5?"g":p>=5?"y":"r";
// datas e semanas (horário de Brasília, UTC-3)
const TZ="America/Sao_Paulo",D0=Date.UTC(2026,9,20);
const semDaData=ts=>Math.floor(Math.floor((new Date(ts).getTime()-3*36e5-D0)/864e5)/7)+1;
const semanaAtual=()=>semDaData(Date.now());
const saC=()=>Math.min(7,Math.max(2,semanaAtual()));
const wIni=w=>new Date(D0+(w-1)*7*864e5),wFim=w=>new Date(D0+((w-1)*7+6)*864e5);
const dm=d=>String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0");
const wLbl=w=>dm(wIni(w))+" a "+dm(wFim(w));
const locked=w=>w>semanaAtual();
const closed=w=>w<semanaAtual();
const fmtD=(ts,o)=>new Date(ts).toLocaleString("pt-BR",{timeZone:TZ,...o});
const dataH=ts=>fmtD(ts,{weekday:"short"}).replace(".","")+", "+fmtD(ts,{day:"2-digit",month:"2-digit"})+" às "+fmtD(ts,{hour:"2-digit",minute:"2-digit"});
// lançamentos que formam a pontuação de uma semana (o último "lançou" de cada atividade ativa)
function contrib(id,w){
  const its=ACT.filter((a,i)=>mk(id,w)[i]==="1").map(a=>a[3]);if(comp(id,w))its.push("complementar");
  return its.map(it=>{let e=null;for(const x of ev)if(x.participante===id&&x.semana===w&&x.item===it&&x.marcado&&(!e||x.id>e.id))e=x;return{it,e}});
}
// situação do lançamento: [texto, classe]
const TURMA={};PESSOAS.forEach(([t,sl])=>TURMA[t+"_"+sl]=t==="seg"?"Segunda":"Sábado");
const encDia=(turma,w)=>ENCONTROS[w]?ENCONTROS[w][turma==="Sábado"?0:1]:null;
const prazoFim=(turma,w)=>{const d=encDia(turma,w);return d?new Date(d+"T23:59:59-03:00").getTime():wIni(w).getTime()+7*864e5+3*36e5-1};
const encLbl=(turma,w)=>{const d=encDia(turma,w);if(!d)return "";const x=new Date(d+"T12:00:00-03:00");return fmtD(x,{weekday:"short"}).replace(".","")+", "+fmtD(x,{day:"2-digit",month:"2-digit"})};
// horário que vale para o prazo: nas semanas de controle, o que o aluno informou
const tEv=e=>!e?null:isCtrl(e.semana)?(e.horario_informado||null):(e.criado_em||null);
const diaBR=t=>isoBR(t).slice(0,10);
const encIni=(turma,w)=>{const d=encDia(turma,w);return d?new Date(d+"T00:00:00-03:00").getTime():null};
// encontro ao vivo: "dia" | "antes" | "depois" (null = sem horário)
const encSt=e=>{const t=tEv(e);if(t==null)return null;const d=encDia(TURMA[e.participante],e.semana),x=diaBR(t);return x===d?"dia":x<d?"antes":"depois"};
const noPrazo=e=>{const t=tEv(e);if(t==null)return null;
  if(e.item==="encontro")return encSt(e)==="dia";
  const ms=new Date(t).getTime(),ini=wIni(e.semana).getTime()+3*36e5;return ms>=ini&&ms<ini+7*864e5};
// situação do lançamento: [texto, classe]
function sit(e){
  if(!e)return["Sem registro","n"];
  if(/_dia$/.test(e.item))return[e.marcado?"Check do dia":"Check desmarcado",e.marcado?"n":"r"];
  const ctl=CTRL.includes(e.semana),k=ctl?" · controle":"";
  if(!e.marcado)return[ctl?"Removido":"Desfeito","r"];
  const np=noPrazo(e);
  if(np==null)return[ctl?"Controle · sem horário":"Sem horário","n"];
  const ap=!ctl&&!e.horario_exato?" ≈":"";
  if(e.item==="encontro"){const st=encSt(e);
    if(st==="dia")return["No dia do encontro"+ap+k,ap?"y":ctl?"l":"g"];
    return[(st==="antes"?"Antes do encontro":"Depois do encontro")+ap+k,"r"]}

  return np?["No prazo"+k,ctl?"l":"g"]:["Fora da semana"+k,"r"];
}

function toast(msg,err,ms){const t=$("toast");t.textContent=msg;t.className="toast on"+(err?" err":"");clearTimeout(t._h);t._h=setTimeout(()=>t.className="toast"+(err?" err":""),ms||(err?3000:1300))}
// números que sobem suavemente
function countUp(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const k=el.dataset.key,to=+el.dataset.count,from=cnt[k]??0;cnt[k]=to;
    if(from===to||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(to);return}
    const t0=performance.now(),d=700;
    const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=p<1?fmt(Math.round((from+(to-from)*e)*2)/2):fmt(to);if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
const num=(k,v)=>`<span data-count="${v}" data-key="${k}">${fmt(cnt[k]??0)}</span>`;

function sair(){me=null;sess=null;ls.del("sementes_sessao");go("pick")}

  const erro=(t,el)=>{msg.textContent=t;const r=(el||i).parentNode;r.classList.remove("bad");void r.offsetWidth;r.classList.add("bad");if(navigator.vibrate)navigator.vibrate(120)};
  if(novo)i.oninput=()=>{const n=i.value.length,f=$("pwM");f.style.width=Math.min(100,n/8*100)+"%";f.className=n<4?"r":n<7?"y":"g";msg.textContent=""};
  $("pwf").onsubmit=async e=>{
    e.preventDefault();msg.textContent="";
    const v=i.value;
    if(novo){
      if(v.length<4)return erro("A senha precisa ter pelo menos 4 caracteres.");
      if(v!==i2.value)return erro("As duas senhas não são iguais.",i2);
    }else if(!v)return erro("Digite sua senha.");
    btn.disabled=true;btn.textContent=novo?"Criando...":"Entrando...";
    try{
      const {data:tk,error}=await sb.rpc(novo?"sementes_cadastrar":"sementes_entrar",{p_id:s.id,p_senha:v});
      if(error)throw error;
      if(!tk){
        btn.disabled=false;btn.textContent=novo?"Criar senha e entrar":"Entrar";
        if(novo){pwState="existe";renderSenha();$("pwMsg").textContent="Este nome já tem senha cadastrada. Digite a senha ou fale com a liderança.";return}
        return erro("Senha incorreta. Confira e tente de novo.");
      }
      sess={id:s.id,token:tk};ls.set("sementes_sessao",JSON.stringify(sess));
      me=s.id;sel=null;wk=null;
      toast(novo?"Senha criada! Bem-vindo(a), "+nome+" 🌱":"Bem-vindo(a), "+nome+"! 🌱");go("aluna");carregarEventos().then(render).catch(()=>{});
    }catch(err){btn.disabled=false;btn.textContent=novo?"Criar senha e entrar":"Entrar";erro("Não foi possível conectar. Tente de novo.")}
  };
}

function renderPin(state){
  paint(`<section class="card pin"><div class="ic">🔐</div><div class="h2" style="margin-top:12px">Líder do projeto</div>
  <div class="mu">Digite o código de acesso de 4 números</div>
  <div class="dots ${state||""}" id="dots">${[0,1,2,3].map(i=>`<i class="${i<pinTxt.length?"on":""}"></i>`).join("")}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="ghost" id="pinBack">Voltar</button><button data-n="0">0</button><button class="ghost" id="pinDel">⌫</button></div></section>`,"pin");
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>pinKey(b.dataset.n));
  $("pinDel").onclick=()=>{pinTxt=pinTxt.slice(0,-1);renderPin()};
  $("pinBack").onclick=()=>{pinTxt="";go(me?"aluna":"pick")};
}
function pinKey(n){
  if(pinTxt.length>=4)return;
  pinTxt+=n;
  if(pinTxt.length<4)return renderPin();
  if(pinTxt===CFG.codigoLider){renderPin("good");ls.set("sementes_lider","1");pinTxt="";setTimeout(()=>{go("lider");if(sb)carregar().then(render).catch(()=>{})},350)}
  else{renderPin("bad");if(navigator.vibrate)navigator.vibrate(120);setTimeout(()=>{pinTxt="";renderPin()},650)}
}
document.addEventListener("keydown",e=>{if(mode!=="pin")return;if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace"){pinTxt=pinTxt.slice(0,-1);renderPin()}});

function cardDias(a,w,editavel){
  const it=a[3],ds=diasS(me,w,it),n=[...ds].filter(c=>c==="1").length,ok=mk(me,w)[ACT.indexOf(a)]==="1",leg=diasLeg(me,w,it)||(ok&&n<7);
  let ult=null;for(const x of ev)if(x.participante===me&&x.semana===w&&x.item===it+"_dia"&&x.marcado&&(!ult||x.id>ult.id))ult=x;
  const ce=ev.filter(x=>x.participante===me&&x.semana===w&&x.item===it+"_dia");
  const quandoDia=k=>{let e=null;for(const x of ce)if(x.dia===k&&(!e||x.id>e.id))e=x;return e&&e.marcado&&e.criado_em?fmtD(e.criado_em,{day:"2-digit",month:"2-digit"}):""};
  return `<div class="act daily ${a[2]} ${ok?"done":""} ${editavel?"":"ro"}"><div class="dtop"><span class="bub">${ok?"✓":a[0]}</span><span class="tx">${a[1]}
      <small class="when">${leg?"✓ concluída antes do check diário":ok?"✓ 7 de 7 dias · concluída":`${n} de 7 dias · complete os 7 para ganhar +2,5`}</small></span><span class="pt">${ok?"+2,5 🌱":n+"/7"}</span></div>
    <div class="dbar"><i style="width:${n/7*100}%"></i></div>
    <div class="dias">${[1,2,3,4,5,6,7].map(k=>{const on=ds[k-1]==="1",q=quandoDia(k);return `<button class="dchk ${on?"on":""}" ${editavel?`data-dia="${k}" data-dit="${it}"`:"disabled"} aria-pressed="${on}"><span>Dia ${k}</span><b>${on?"✓":""}</b>${q?`<small>${q}</small>`:""}</button>`}).join("")}</div>
    ${ult&&ult.criado_em?`<div class="mu dult">Último check: Dia ${ult.dia} · ${dataH(ult.criado_em)}</div>`:""}
    ${!ok&&editavel?`<div class="mu dult">Menos de 7 de 7 = 0 ponto nesta atividade.</div>`:""}</div>`;
}
function marcarDia(it,k,marcar){
  const w=wk,before=pts(me,w),old=get(me),d={...old},ds=diasS(me,w,it).split("");
  ds[k-1]=marcar?"1":"0";d["d"+w+"_"+it]=ds.join("");delete d["dleg"+w+"_"+it];
  const a=mk(me,w).split(""),pos=ACT.findIndex(x=>x[3]===it),ok=ds.every(c=>c==="1");a[pos]=ok?"1":"0";d["s"+w]=a.join("");
  if(a.filter(c=>c==="1").length!==3)d["c"+w]=0;
  data[me]=d;lastSave[me]=Date.now();party=before<10&&pts(me,w)===10;
  if(navigator.vibrate&&marcar)navigator.vibrate(20);
  render();
  busy=busy.then(async()=>{
    try{
      const {data:r,error}=await sb.rpc("sementes_marcar_dia",{p_id:me,p_token:sess&&sess.token,p_item:it,p_dia:k,p_marcar:marcar});
      if(error)throw error;
      data[me]=r.dados;lastSave[me]=Date.now();await carregarEventos();
      const nome=ITEM[it][1],agoraOk=mk(me,w)[pos]==="1";
      toast(marcar?(agoraOk&&ds.every(c=>c==="1")?`🎉 ${nome}: 7 de 7 dias! +2,5 sementes`:`✓ Dia ${k} marcado · ${dataH(r.criado_em)}`):`Dia ${k} desmarcado`,false,marcar?2800:1500);
      render();
    }catch(e){
      data[me]=old;const msg=(e&&e.message)||"";
      if(msg.includes("ACESSO_EXPIRADO")){toast("Seu acesso expirou. Entre de novo com sua senha.",true);setTimeout(sair,1200);return}
      toast(msg&&!/fetch|network|Failed/i.test(msg)?msg:"Não salvou. Confira a internet e tente de novo.",true,4000);render();
    }
  });
}

function lancar(item,marcar){
  const w=wk,before=pts(me,w),old=get(me),d={...old};
  if(item==="complementar")d["c"+w]=marcar?1:0;
  else{const i=ACT.findIndex(a=>a[3]===item),a=mk(me,w).split("");a[i]=marcar?"1":"0";d["s"+w]=a.join("");if(a.filter(c=>c==="1").length!==3)d["c"+w]=0}
  data[me]=d;lastSave[me]=Date.now();
  pop=marcar?(item==="complementar"?4:ACT.findIndex(a=>a[3]===item)):-1;party=before<10&&pts(me,w)===10;
  if(navigator.vibrate&&marcar)navigator.vibrate(25);
  render();
  busy=busy.then(async()=>{
    try{
      const {data:r,error}=await sb.rpc("sementes_lancar",{p_id:me,p_token:sess&&sess.token,p_item:item,p_marcar:marcar});
      if(error)throw error;
      data[me]=r.dados;lastSave[me]=Date.now();
      await carregarEventos();
      toast(marcar?`✓ Lançado na Semana ${r.semana} · ${dataH(r.criado_em)}`:"Lançamento desfeito",false,marcar?3200:1500);
      if(r.semana!==w)wk=r.semana;
      render();
    }catch(e){
      data[me]=old;const msg=(e&&e.message)||"";
      if(msg.includes("ACESSO_EXPIRADO")){toast("Seu acesso expirou. Entre de novo com sua senha.",true);setTimeout(sair,1200);return}
      toast(msg&&!/fetch|network|Failed/i.test(msg)?msg:"Não salvou. Confira a internet e tente de novo.",true,4000);render();
    }
  });
}

async function registrarControle(item,marcar,v){

    if(r&&r.dados){data[me]=r.dados;lastSave[me]=Date.now()}

// Momento em que a pessoa chegou à pontuação da semana = horário do último lançamento que conta.
// Para cada pessoa na semana: pontos lançados no prazo e quando completou.
// O horário de conclusão é comparado em relação ao DIA DO ENCONTRO da própria turma,
// para a turma de sábado não parecer "na frente" só porque o encontro dela acontece antes.
function concl(id,w){
  const c=contrib(id,w);if(!c.length)return null;
  let t=-Infinity,aprox=false,sem=false,np=0,fora=0;
  for(const x of c){const v=noPrazo(x.e);
    if(v==null){sem=true;continue}
    if(v){np++;t=Math.max(t,new Date(tEv(x.e)).getTime());if(x.e&&!x.e.horario_exato&&!isCtrl(w))aprox=true}else fora++}
  const tt=t===-Infinity?null:t,ini=encIni(TURMA[id],w);
  return{t:tt,aprox,sem,fora,pp:Math.min(10,np*PT),rel:tt==null||ini==null?null:tt-ini};
}
// Critério: 1) maior pontuação lançada no prazo (encontro ao vivo lançado no dia do encontro)
//           2) empate: quem completou mais cedo em relação ao dia do encontro da própria turma
//           3) maior pontuação total na semana  4) ordem alfabética
const aK=c=>c&&c.rel!=null?c.rel:Infinity;
function classif(w,L){
  return (L||fil()).map(s=>{const c=concl(s.id,w);return{s,p:pts(s.id,w),pp:c?c.pp:0,c}}).filter(x=>x.p>0)
    .sort((a,b)=>b.pp-a.pp||(aK(a.c)===aK(b.c)?0:aK(a.c)<aK(b.c)?-1:1)||b.p-a.p||a.s.n.localeCompare(b.s.n));
}

const relTxt=ms=>ms==null?"":ms<0?durTxt(-ms)+" antes do dia do encontro":ms<864e5?"no dia do encontro":durTxt(ms-864e5)+" depois do dia do encontro";

function linhasH(){
  const L=fil().filter(s=>norm(s.n).includes(norm(hQ))),ws=hW==="todas"?W:[hW];
  let out=[];
  if(hModo==="validos"){
    L.forEach(s=>ws.forEach(w=>contrib(s.id,w).forEach(x=>out.push({s,w,it:x.it,e:x.e}))));
  }else{
    const ids=new Map(L.map(s=>[s.id,s]));
    ev.forEach(e=>{if(ids.has(e.participante)&&ws.includes(e.semana))out.push({s:ids.get(e.participante),w:e.semana,it:e.item,e})});
  }
  if(hSt!=="todos")out=out.filter(x=>{const v=x.e&&x.e.marcado?noPrazo(x.e):undefined;return hSt==="no"?v===true:hSt==="fora"?v===false:v===null});
  const t=x=>x.e&&x.e.criado_em?new Date(x.e.criado_em).getTime():-1;
  return out.sort((a,b)=>t(b)-t(a)||a.s.n.localeCompare(b.s.n)||a.w-b.w);
}

let tStep=0,tDir=1,tTimer=null,tDemo=[0,0,0,0],tRec=0,tSeed=20,tPrize=1,tX=null;
const TOUR=[
 {c:"sage",t:"Boas-vindas ao Desafio das Sementes",
  p:"Durante <b>7 semanas</b> você planta sementes cumprindo as atividades do Módulo 1. Cada semana vale até <b>10 sementes</b>.",
  a:()=>`<div class="tdemo-big">🌱</div><div class="tstats"><span>📅 7 semanas</span><span>✅ 4 atividades</span><span>🎯 10 por semana</span></div>`},
 {c:"sky",t:"Entre e crie sua senha",
  p:"Escolha sua <b>turma</b> e toque em <b>Selecione seu nome</b> para abrir a lista. No <b>primeiro acesso</b> você cria uma senha só sua; nas próximas vezes, é só digitá-la.",
  a:()=>`<div class="tlogin"><div class="tddfake">👤 Selecione seu nome <span>⌄</span></div><div class="lbl" style="margin:10px 0 6px">✨ Crie sua senha</div><div class="tfield"><span id="tType"></span><span class="caret"></span></div></div><span class="thint">🔒 Sua senha é pessoal, não compartilhe</span>`,
  go:()=>{const el=$("tType"),txt="•••••••••••";let i=0;tTimer=setInterval(()=>{if(!el.isConnected)return clearInterval(tTimer);i=i>txt.length+6?0:i+1;el.textContent=txt.slice(0,i)},140)}},
 {c:"peach",t:"Plante suas sementes",
  p:"São <b>4 atividades</b> por semana e cada uma vale <b>+2,5 sementes</b>. <b>Leitura bíblica</b> e <b>atividade proposta</b> têm check por dia (Dia 1 a Dia 7) e só valem com os 7 dias. <b>Experimente aqui:</b>",
  a:()=>{const v=tDemo.reduce((a,b)=>a+b,0)*PT;return `<div class="tscore">${v===10?"🏆 ":""}${fmt(v)}<small> /10</small></div><div class="tseeds">${Array.from({length:4},(_,k)=>`<span class="${k<v/PT?"on":""}">🌱</span>`).join("")}</div>
   <div class="tacts">${ACT.map((x,i)=>`<button class="${x[2]} ${tDemo[i]?"on":""}" data-td="${i}" title="${x[1]}">${x[0]}</button>`).join("")}</div><span class="thint">${v===10?"Semana completa! 🎉":"Toque nos ícones"}</span>`},
  bind:()=>document.querySelectorAll("[data-td]").forEach(b=>b.onclick=()=>{tDemo[+b.dataset.td]^=1;if(navigator.vibrate)navigator.vibrate(15);tourArt()})},
 {c:"lav",t:"Faltou uma? Leitura complementar",
  p:"Fez <b>3 das 4 atividades</b>? Leia o livro complementar da semana e ganhe <b>+2,5</b> para completar os 10. A opção aparece sozinha no seu painel. <b>Teste:</b>",
  a:()=>{const v=7.5+tRec*PT;return `<div class="tscore">${v===10?"🏆 ":""}${fmt(v)}<small> /10</small></div><div class="tseeds">${Array.from({length:4},(_,k)=>`<span class="${k<v/PT?"on":""}">${k===3?"📚":"🌱"}</span>`).join("")}</div>
   <div class="segs lav"><button data-tr="1" class="${tRec?"on":""}">${tRec?"✓ Li o livro":"📚 Li o livro"} · +2,5</button></div><span class="thint">3 atividades: 7,5 · Leitura: +${tRec?"2,5":"0"}</span>`},
  bind:()=>document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{tRec^=1;tourArt()})},
 {c:"sky",t:"Lance durante a semana",
  p:"Cada lançamento fica registrado com <b>dia e hora</b>. Você só consegue lançar na <b>semana atual</b>: o que você lançar hoje conta na semana de hoje. Semana que passou não abre mais, então lance em dia!",
  a:()=>{const sa=saC();return `<div class="tlogin"><div class="lbl">📅 Hoje · ${fmtD(Date.now(),{weekday:"long"})}</div><b style="display:block;margin:2px 0 10px">Semana ${sa} · ${wLbl(sa)}</b><div class="tfield" style="border-color:var(--sage-d);font-size:13.5px;flex-wrap:wrap;gap:2px">🎥 Assistir às aulas<span class="mu" style="width:100%;font-size:12px">✓ lançado ${dataH(Date.now())}</span></div></div><span class="thint">🔒 Semanas passadas ficam só para consulta</span>`}},
 {c:"butter",t:"Veja sua planta crescer",
  p:"Seu total (até <b>"+MAXT+" sementes</b>) faz a sua planta evoluir. No painel você também vê o <b>jardim da turma</b>, com uma planta para cada pessoa. <b>Arraste para ver:</b>",
  a:()=>{const sg=stage(tSeed);return `<div class="tdemo-big" style="font-size:58px">${sg[1]}</div><b>${sg[2]} · ${fmt(tSeed)} sementes</b><input class="trange" type="range" min="0" max="${MAXT}" step="2.5" value="${tSeed}" id="tRange" aria-label="Total de sementes">
   <div class="tstages">${STAGES.map(x=>`<span class="${tSeed>=x[0]?"on":""}">${x[1]}</span>`).join("")}</div>`},
  bind:()=>{const r=$("tRange");r.oninput=()=>{tSeed=+r.value;const v=tSeed;tourArt();const n=$("tRange");n.value=v;n.focus()}}},
 {c:"blush",t:"Prêmios toda semana",
  p:"Quem fecha a semana concorre ao prêmio dela. No fim, quem tiver <b>mais sementes</b> ganha <b>50% de desconto</b>, e o 2º lugar ganha <b>50% para presentear alguém</b>. <b>Toque nas semanas:</b>",
  a:()=>`<div class="tprizes">${W.map(w=>`<button data-tp="${w-1}" class="${tPrize===w-1?"on":""}">S${w}</button>`).join("")}</div><div class="tpz">🎁 ${PR[tPrize]}</div><span class="thint">🥇 Grande prêmio no final</span>`,
  bind:()=>document.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{tPrize=+b.dataset.tp;tourArt()})},
 {c:"sage",t:"Tudo pronto!",
  p:"Volte durante a semana para lançar suas atividades. Se esquecer como funciona, toque em <b>📘 Manual</b> no topo da página.",
  a:()=>`<div class="tdemo-big">🌳</div><div class="tstats"><span>📲 Salve o link no celular</span><span>⏰ Lance toda semana</span></div>`}
];
function openTour(){tStep=0;tDir=1;tDemo=[0,0,0,0];tRec=0;tSeed=20;tPrize=1;renderTour();document.body.style.overflow="hidden"}
function closeTour(){clearInterval(tTimer);ls.set("sementes_manual","1");$("tourRoot").innerHTML="";document.body.style.overflow=""}
function tourArt(){const st=TOUR[tStep],a=$("tArt");a.innerHTML=st.a();st.bind&&st.bind()}
function tourGo(n){if(n<0||n>=TOUR.length)return;tDir=n>=tStep?1:-1;tStep=n;renderTour()}
function renderTour(){
  clearInterval(tTimer);
  const st=TOUR[tStep],last=tStep===TOUR.length-1;
  $("tourRoot").innerHTML=`<div class="tour" id="tour" role="dialog" aria-modal="true" aria-label="Manual de instrução"><div class="tcard" id="tcard">
    <div class="ttop"><div class="tprog">${TOUR.map((_,i)=>`<i class="${i<=tStep?"on":""}"></i>`).join("")}</div><button class="tskip" id="tSkip">${last?"Fechar":"Pular manual"}</button></div>
    <div class="tbody ${tDir<0?"back":""} ${st.c}">
      <div class="tart" id="tArt"></div>
      <div class="tstep">Passo ${tStep+1} de ${TOUR.length}</div>
      <h3>${st.t}</h3><p>${st.p}</p>
    </div>
    <div class="tnav"><button class="tb" id="tPrev" ${tStep?"":"disabled"}>Voltar</button><button class="tn" id="tNext">${last?"Começar 🌱":"Próximo"}</button></div>
    <div class="tdots">${TOUR.map((_,i)=>`<button data-tg="${i}" class="${i===tStep?"on":""}" aria-label="Ir para o passo ${i+1}"></button>`).join("")}</div>
  </div></div>`;
  tourArt();st.go&&st.go();
  $("tSkip").onclick=closeTour;
  $("tPrev").onclick=()=>tourGo(tStep-1);
  $("tNext").onclick=()=>last?closeTour():tourGo(tStep+1);
  document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>tourGo(+b.dataset.tg));
  $("tour").onclick=e=>{if(e.target.id==="tour")closeTour()};
  const c=$("tcard");
  c.ontouchstart=e=>{tX=e.target.closest("input,.tacts,.segs,.tprizes")?null:e.touches[0].clientX};
  c.ontouchend=e=>{if(tX===null)return;const dx=e.changedTouches[0].clientX-tX;if(Math.abs(dx)>60)tourGo(tStep+(dx<0?1:-1));tX=null};
}
document.addEventListener("keydown",e=>{if(!$("tour"))return;if(e.key==="Escape")closeTour();else if(e.key==="ArrowRight")tourGo(tStep+1);else if(e.key==="ArrowLeft")tourGo(tStep-1)});

/* ===================== DADOS (SUPABASE) ===================== */
async function carregarEventos(){
  let q=sb.from("desafio_sementes_lancamentos").select("id,participante,semana,item,dia,marcado,pontos,criado_em,origem,horario_exato,obs,horario_informado,ajustado_lider,criado_em_original").order("id").limit(20000);
  if(mode!=="lider"){if(!me)return;q=q.eq("participante",me)}
  const {data:r,error}=await q;if(error)throw error;
  ev=r.map(x=>({...x,pontos:+x.pontos}));
}
async function carregar(){
  const {data:rows,error}=await sb.from(CFG.tabela).select("id,dados,updated_at");
  if(error)throw error;
  rows.forEach(r=>{upd[r.id]=r.updated_at;if(Date.now()-(lastSave[r.id]||0)>5000)data[r.id]=r.dados||{}});
  try{await carregarEventos()}catch(e){}
  if(mode==="lider"){try{const {data:c}=await sb.rpc("sementes_cadastrados");if(c)cad=new Set(c.map(x=>typeof x==="string"?x:Object.values(x)[0]))}catch(e){}}
  ok=true;lastUpd=new Date();$("warn").innerHTML="";
}

render();
if(!ls.get("sementes_manual")&&mode!=="lider")setTimeout(openTour,400);
(async()=>{
  try{
    sb=supabase.createClient(CFG.url,CFG.key);
    await carregar();
  }catch(e){
    ok=false;$("warn").innerHTML='<div class="warn">Não foi possível conectar. Verifique sua internet e recarregue a página.</div>';
  }
  ready=true;render();
  if(!sb)return;
  sb.channel("sementes").on("postgres_changes",{event:"*",schema:"public",table:CFG.tabela},p=>{
    const r=p.new;if(!r||!r.id)return;
    upd[r.id]=r.updated_at;lastUpd=new Date();
    if(Date.now()-(lastSave[r.id]||0)>5000){data[r.id]=r.dados||{};if(mode==="aluna"||mode==="lider")render()}
  }).on("postgres_changes",{event:"UPDATE",schema:"public",table:"desafio_sementes_lancamentos"},p=>{
    const r=p.new;if(!r||!r.id)return;const i=ev.findIndex(x=>x.id===r.id);if(i<0)return;
    ev[i]={...r,pontos:+r.pontos};if(mode==="lider")render();
  }).on("postgres_changes",{event:"INSERT",schema:"public",table:"desafio_sementes_lancamentos"},p=>{
    const r=p.new;if(!r||!r.id||ev.some(x=>x.id===r.id))return;
    if(mode!=="lider"&&r.participante!==me)return;
    ev.push({...r,pontos:+r.pontos});lastUpd=new Date();if(mode==="lider")render();
  }).subscribe(st=>{if(st==="SUBSCRIBED"){ok=true;if(mode==="lider")header()}});
  setInterval(()=>{if(mode==="lider")carregar().then(render).catch(()=>{ok=false;header()})},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)carregar().then(render).catch(()=>{})});
})();
</script>
